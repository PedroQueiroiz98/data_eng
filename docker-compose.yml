name: nbplatform

# Todas as variáveis de override usam o prefixo NBP_ para não colidir com
# variáveis já presentes no shell (POSTGRES_PASSWORD, REDIS_URL, etc.).

x-backend-env: &backend-env
  APP_ENV: ${NBP_APP_ENV:-dev}
  LOG_LEVEL: ${NBP_LOG_LEVEL:-INFO}
  DATABASE_URL: ${NBP_DATABASE_URL:-postgresql+asyncpg://nbplatform:nbplatform@postgres:5432/nbplatform}
  REDIS_URL: ${NBP_REDIS_URL:-redis://redis:6379/0}
  SECRET_ENCRYPTION_KEY: ${NBP_SECRET_ENCRYPTION_KEY:-iY0uDAIk3AqhPlmaVTZOGf-Bajj5kjmIDRZiwqRLvDc=}
  JWT_SECRET: ${NBP_JWT_SECRET:-dev-only-change-me-jwt-secret-0123456789abcdef}
  JWT_EXPIRE_MINUTES: ${NBP_JWT_EXPIRE_MINUTES:-720}
  ADMIN_EMAIL: ${NBP_ADMIN_EMAIL:-admin@nbplatform.local}
  ADMIN_PASSWORD: ${NBP_ADMIN_PASSWORD:-admin}
  EXECUTION_SANDBOX: ${NBP_EXECUTION_SANDBOX:-subprocess}
  SANDBOX_IMAGE: ${NBP_SANDBOX_IMAGE:-nbplatform-backend}
  SANDBOX_CPUS: ${NBP_SANDBOX_CPUS:-1}
  SANDBOX_MEMORY: ${NBP_SANDBOX_MEMORY:-512m}
  MAX_CONCURRENT_JOBS: ${NBP_MAX_CONCURRENT_JOBS:-5}
  MAX_CONCURRENT_EXECUTIONS: ${NBP_MAX_CONCURRENT_EXECUTIONS:-5}
  EXECUTION_TIMEOUT_S: ${NBP_EXECUTION_TIMEOUT_S:-1800}
  WORKER_HEARTBEAT_INTERVAL_S: ${NBP_WORKER_HEARTBEAT_INTERVAL_S:-10}
  WORKER_LEASE_TIMEOUT_S: ${NBP_WORKER_LEASE_TIMEOUT_S:-60}
  RECOVERY_INTERVAL_S: ${NBP_RECOVERY_INTERVAL_S:-30}
  EXECUTION_MAX_RETRIES: ${NBP_EXECUTION_MAX_RETRIES:-2}
  EXECUTION_RETRY_INITIAL_DELAY_S: ${NBP_EXECUTION_RETRY_INITIAL_DELAY_S:-10}
  EXECUTION_RETRY_BACKOFF_MULTIPLIER: ${NBP_EXECUTION_RETRY_BACKOFF_MULTIPLIER:-2}
  EXECUTION_RETRY_MAX_DELAY_S: ${NBP_EXECUTION_RETRY_MAX_DELAY_S:-300}
  EXECUTION_RETRY_MODE: ${NBP_EXECUTION_RETRY_MODE:-TRANSIENT_ONLY}
  WORKSPACES_DIR: ${NBP_WORKSPACES_DIR:-/data/workspaces}
  # Central de Notificações: providers (EMAIL/BITRIX) e secrets são configurados
  # pela UI (/notifications) e cifrados no banco. Aqui só parâmetros operacionais.
  APP_BASE_URL: ${NBP_APP_BASE_URL:-http://localhost:5173}
  NOTIFICATION_MAX_ATTEMPTS: ${NBP_NOTIFICATION_MAX_ATTEMPTS:-3}
  NOTIFICATION_RETRY_INITIAL_DELAY_S: ${NBP_NOTIFICATION_RETRY_INITIAL_DELAY_S:-5}
  NOTIFICATION_RETRY_BACKOFF_MULTIPLIER: ${NBP_NOTIFICATION_RETRY_BACKOFF_MULTIPLIER:-3}
  NOTIFICATION_RETRY_MAX_DELAY_S: ${NBP_NOTIFICATION_RETRY_MAX_DELAY_S:-300}
  NOTIFICATION_SEND_TIMEOUT_S: ${NBP_NOTIFICATION_SEND_TIMEOUT_S:-20}
  NOTIFICATION_STALE_AFTER_S: ${NBP_NOTIFICATION_STALE_AFTER_S:-120}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nbplatform
      POSTGRES_PASSWORD: nbplatform
      POSTGRES_DB: nbplatform
    ports:
      - "${NBP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbplatform -d nbplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${NBP_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m nbplatform.api"]
    environment:
      <<: *backend-env
    volumes:
      - execution_artifacts:/data/executions
      - workspaces:/data/workspaces
      - workspace:/data/workspace
    ports:
      - "${NBP_BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nbplatform.scripts.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "nbplatform.worker"]
    environment:
      <<: *backend-env
    volumes:
      - execution_artifacts:/data/executions
      - workspaces:/data/workspaces
      - workspace:/data/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "nbplatform.scheduler"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  kernel:
    build:
      context: ./backend
    command: ["python", "-m", "nbplatform.kernel_worker"]
    environment:
      <<: *backend-env
    volumes:
      - execution_artifacts:/data/executions
      - workspaces:/data/workspaces
      - workspace:/data/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_BASE_URL: ${NBP_VITE_API_BASE_URL:-/api}
      VITE_WS_BASE_URL: ${NBP_VITE_WS_BASE_URL:-/ws}
      VITE_BACKEND_ORIGIN: http://backend:8000
    ports:
      - "${NBP_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  execution_artifacts:
  workspaces:
  workspace:
