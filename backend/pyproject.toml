[project]
name = "nbplatform"
version = "0.1.0"
description = "Plataforma web para criação, execução e orquestração de notebooks Python (Papermill)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "cryptography>=43.0",
    "apscheduler>=3.10,<4.0",
    "nbformat>=5.10",
    "papermill>=2.6",
    "ipykernel>=6.29",
    "jupyter-client>=8.6",
    "nbconvert>=7.16",
    "pyarrow>=18.0",
    "pyjwt>=2.9",
    "jedi>=0.19",
    "pyflakes>=3.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbplatform", "src/workspace_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Migrations são geradas pelo Alembic; não vale a pena lintar linha a linha.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# TCH/TC ficam de fora: SQLAlchemy 2.x inspeciona anotações `Mapped[...]` em
# runtime, então `uuid`/`datetime` não podem ir para blocos TYPE_CHECKING.
ignore = ["B008"]  # FastAPI Depends() em valores default

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
warn_return_any = false
# jedi / pyflakes não publicam py.typed; `import-not-found` (dep ausente de
# verdade) continua ativo.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "nbformat.*",
    "nbconvert.*",
    "jupyter_client.*",
    "papermill.*",
    "jedi",
    "jedi.*",
    "pyflakes",
    "pyflakes.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Libs sem tipos (nbformat, papermill, redis pubsub) — permitir chamadas não-tipadas
# nestes módulos-ponte.
module = [
    "nbplatform.domain.notebook_format",
    "nbplatform.worker.papermill_runner",
    "nbplatform.ws.events",
    "nbplatform.services.lsp.jedi_backend",
    "nbplatform.services.lsp.diagnostics",
    "nbplatform.services.lsp.autoimport",
    "nbplatform.services.lsp.service",
    "nbplatform.api.routes.lsp",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Um único event loop para toda a sessão: casa com o engine SQLAlchemy/Redis
# global cacheado (evita "Event loop is closed" entre testes).
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
